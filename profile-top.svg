<g class="fd" style="animation-delay:1.44s"><circle class="dot" cx="61" cy="705" r="2.6"/><text class="b" x="74" y="710"><tspan class="l">Hackathons: </tspan>1st Prize, Code Meet 2025; 1st Place, Srinathon 2.0 (MCA Track, 330+ teams); Runner-</text><text class="b" x="74" y="732">Up, CodeSprint 2026 national hackathon (53+ teams).</text></g>
