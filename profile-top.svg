.d1{animation:m1 14s ease-in-out infinite}.d2{animation:m2 16s ease-in-out infinite}
@keyframes m1{50%{transform:translate(40px,20px)}}
@keyframes m2{50%{transform:translate(-40px,-20px)}}

:root{--bg:#ffffff;--tx:#0f172a;--mu:#334155;--ac:#4f46e5;--ln:#e5e7eb}
