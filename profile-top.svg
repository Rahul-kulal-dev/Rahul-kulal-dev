<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1426" viewBox="0 0 1000 1426" role="img" aria-label="Rahul Kulal - Java Backend Developer. About me." xmlns:c2pa="http://c2pa.org/manifest">
<style>
:root{--bg:#ffffff;--tx:#0f172a;--mu:#64748b;--ac:#4f46e5;--ln:#e2e8f0;--dot:#cbd5e1;--chip:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--tx:#f0f6fc;--mu:#8b949e;--ac:#a5b4fc;--ln:#30363d;--dot:#2a313c;--chip:#161b22}}
text{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
.card{fill:var(--bg);stroke:var(--ln);stroke-width:1.5}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:6px;fill:var(--ac)}
.name{font-size:76px;font-weight:800;fill:var(--tx);letter-spacing:-2.5px}
.sub{font-size:18px;fill:var(--mu)}
.chip{fill:var(--chip);stroke:var(--ln);stroke-width:1.2}
.ct{font-size:13px;font-weight:600;fill:var(--tx)}
.fd{opacity:0;animation:in .8s cubic-bezier(.2,.7,.2,1) forwards}
