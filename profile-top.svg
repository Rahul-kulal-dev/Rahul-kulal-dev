text{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif}
.card{fill:var(--bg);stroke:var(--ln);stroke-width:1.5}
.lab{font-size:13px;font-weight:700;letter-spacing:5px;fill:var(--ac)}
.nm{font-size:34px;font-weight:800;fill:var(--tx);letter-spacing:0}
.h{font-size:13px;font-weight:700;letter-spacing:3px;fill:var(--tx)}
.b{font-size:15px;fill:var(--mu)}
.l{font-weight:700;fill:var(--ac)}
.acb{fill:url(#g)}.dot{fill:var(--ac)}
.rule{stroke:var(--ln);stroke-width:1.2}
.fd{opacity:0;animation:in .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

